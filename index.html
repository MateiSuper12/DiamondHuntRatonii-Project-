<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vânătoarea de diamante · Survival-Earth</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:16px/1.6 Rubik,system-ui,sans-serif;color:#f6ecd2;background:linear-gradient(#3f7be0,#78b2ff 40%,#bfe0ff 55%,#6abf3f 55% 57%,#7a5230 57%,#2c1f13)}
    .game{width:100%;max-width:520px;text-align:center;padding:20px 14px;border:3px solid #000;background:#1b1208;box-shadow:inset 0 0 0 3px #d4a017,0 10px 40px #0008}
    h1{margin:0;font:400 clamp(13px,3.8vw,19px)/1.6 'Press Start 2P',monospace;color:#f5c542;text-shadow:3px 3px #3a2600}
    .gbox{position:relative;margin:14px auto 0;border:4px solid #000;box-shadow:0 0 0 3px #d4a017}
    .gc{display:block;width:100%;height:auto;touch-action:none;background:linear-gradient(#10243f,#1d3a1f);cursor:ew-resize;image-rendering:pixelated}
    .gov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;padding:14px;background:#0a0705ea}
    .gt{font:400 clamp(.8rem,3.6vw,1.1rem)/1.5 'Press Start 2P',monospace;color:#f5c542}.gd{max-width:380px;font-size:.92rem;color:#ecdfba}
    .btn{display:inline-block;padding:11px 22px;font:700 .95rem Rubik,sans-serif;cursor:pointer;text-decoration:none;color:#1a1206;background:linear-gradient(#ffe27a,#f0a800);border:3px solid #000;box-shadow:inset -4px -4px #b87a00,inset 4px 4px #fff3b0}
    .btn:hover{filter:brightness(1.1)}.prize{display:none}.game.won .prize{display:block}.game.won .gbox{display:none}
    .kw{display:block;margin:12px 0 14px;font:400 clamp(.8rem,4.2vw,1.3rem) 'Press Start 2P',monospace;color:#f5c542;word-break:break-all;user-select:all}
    .lk{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.lk .btn{font-size:.8rem;padding:8px 14px}
  </style>
</head>
<body>
  <div class="game">
    <h1>⛏ Vânătoarea de diamante</h1>
    <p style="margin:10px 0 0;color:#c9b886;font-size:.9rem">Aici este păzit cuvântul-cheie pentru Staff Apply.</p>
    <div class="gbox">
      <canvas class="gc" width="480" height="360"></canvas>
      <div class="gov">
        <div class="gt">DIAMANTE</div>
        <div class="gd">Mișcă cufărul (mouse, deget sau tastele ← →) și prinde <b>20 de puncte</b>: diamant = 1, smarald = 3. Ferește-te de TNT! Ai 3 vieți.</div>
        <button type="button" class="btn gs">START</button>
      </div>
    </div>
    <div class="prize">🏆 Felicitări! Cuvântul-cheie este:<span class="gold kw"></span><button type="button" class="btn kc">📋 Copiază cuvântul-cheie</button></div>
    <div class="lk">
      <a class="btn" href="https://panel.ratonii.ro/rules/view">⬅ Înapoi la regulament</a>
      <a class="btn" href="https://panel.ratonii.ro/staff-apply">📖 Aplică pentru Staff</a>
    </div>
  </div>

  <script>
    document.querySelector('.gs').onclick=function(){var b=this,g=b.closest('.game'),cv=g.querySelector('canvas'),cx=cv.getContext('2d'),ov=g.querySelector('.gov'),W=480,H=360,A=window.erA||(window.erA={});
    if(A.run)return;cx.imageSmoothingEnabled=false;
    function spr(r,p){var c=document.createElement('canvas');c.width=c.height=8;var x=c.getContext('2d');r.forEach(function(s,j){for(var i=0;i<8;i++){if(p[s.charAt(i)]){x.fillStyle=p[s.charAt(i)];x.fillRect(i,j,1,1)}}});return c}
    var G={d:spr(['...cc...','..cwcc..','.cwccdc.','cwccccdd','.ccccdd.','..cdddd.','...dd...','........'],{c:'#4aedd9',d:'#1fb5a6',w:'#fff'}),e:spr(['...cc...','..cwcc..','.cwccdc.','cwccccdd','.ccccdd.','..cdddd.','...dd...','........'],{c:'#3ddc6a',d:'#128a3a',w:'#d8ffe2'}),t:spr(['rrrrrrrr','rrrrrrrr','wwwwwwww','wkwwkkkw','wwwwwwww','rrrrrrrr','rrrrrrrr','dddddddd'],{r:'#d33a2a',w:'#eee',k:'#222',d:'#822'}),c:spr(['bbbbbbbb','bddddddb','bddggddb','bbbggbbb','bddddddb','bddddddb','bddddddb','bbbbbbbb'],{b:'#5a3410',d:'#a0702c',g:'#e8c24a'})};
    function beep(f,d){try{A.ac=A.ac||new(window.AudioContext||window.webkitAudioContext)();var o=A.ac.createOscillator(),q=A.ac.createGain();o.type='square';o.frequency.value=f;q.gain.value=.06;q.gain.exponentialRampToValueAtTime(.001,A.ac.currentTime+d);o.connect(q);q.connect(A.ac.destination);o.start();o.stop(A.ac.currentTime+d)}catch(e){}}
    if(!A.b){A.b=1;A.px=W/2;function mv(e){var r=cv.getBoundingClientRect();A.px=Math.max(32,Math.min(W-32,(e.clientX-r.left)/r.width*W))}
    cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
    document.addEventListener('keydown',function(e){if(!A.run)return;if(e.key==='ArrowLeft'){A.px=Math.max(32,A.px-28);e.preventDefault()}if(e.key==='ArrowRight'){A.px=Math.min(W-32,A.px+28);e.preventDefault()}})}
    var sc=0,li=3,it=[],tm=0,nx=0;A.px=W/2;A.run=1;ov.style.display='none';g.classList.remove('won');
    function end(w){A.run=0;if(w){g.querySelector('.kw').textContent=atob('RWFydGhNQ1JhdG9uaWlCJkM=');g.classList.add('won');beep(990,.3)}else{g.querySelector('.gt').textContent='AI PIERDUT';g.querySelector('.gd').textContent='Ai fost aruncat în aer de TNT. Mai încearcă!';b.textContent='REÎNCEARCĂ';ov.style.display='grid'}}function loop(){if(!A.run)return;tm++;if(tm>=nx){var r=Math.random();it.push({x:20+Math.random()*(W-40),y:-24,k:r<.22?'t':r<.34?'e':'d'});nx=tm+Math.max(18,46-sc*1.2)}cx.clearRect(0,0,W,H);cx.fillStyle='rgba(255,255,255,.06)';for(var i=0;i<W;i+=48)cx.fillRect(i,0,2,H);it=it.filter(function(o){o.y+=2.6+sc*.12;if(o.y>H-52&&o.y<H-6&&Math.abs(o.x-A.px)<38){if(o.k=='t'){li--;beep(110,.3)}else{sc+=o.k=='e'?3:1;beep(o.k=='e'?880:660,.1)}return false}if(o.y>H+20)return false;cx.drawImage(G[o.k],o.x-16,o.y-16,32,32);return true});cx.drawImage(G.c,A.px-32,H-60,64,64);cx.fillStyle='#fff';cx.font='bold 16px monospace';cx.fillText('Puncte: '+Math.min(sc,20)+'/20',10,22);cx.fillText('Vieți: '+Array(Math.max(li,0)+1).join('♥'),10,44);if(sc>=20){end(1);return}if(li<=0){end(0);return}requestAnimationFrame(loop)}loop();};
    document.querySelector('.kc').onclick=function(){var t=document.querySelector('.kw').textContent;try{navigator.clipboard.writeText(t);this.textContent='✅ Copiat!'}catch(e){prompt('Copiază:',t)};
    };
  </script>
</body>
</html>
